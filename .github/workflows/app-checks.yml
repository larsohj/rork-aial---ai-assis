name: App checks

on:
  pull_request:
    paths: ['expo/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['expo/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:release
      - name: Export web application
        run: bunx expo export --platform web
      - name: Bundle iOS JavaScript
        run: bunx expo export --platform ios --output-dir dist-ios
